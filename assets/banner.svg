<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg-grid {
      stroke: rgba(255, 255, 255, 0.04);
      stroke-width: 1;
    }
    .flow-line {
      stroke: #38bdf8;
      stroke-width: 2.5;
      stroke-linecap: round;
      opacity: 0.6;
      stroke-dasharray: 8, 12;
      animation: flowStream 12s linear infinite;
    }
    .flow-line-alt {
      stroke: #a855f7;
      stroke-width: 2;
      stroke-linecap: round;
      opacity: 0.5;
      stroke-dasharray: 6, 10;
      animation: flowStreamRev 16s linear infinite;
    }
    .flow-line-emerald {
      stroke: #10b981;
      stroke-width: 2;
      stroke-linecap: round;
      opacity: 0.5;
      stroke-dasharray: 6, 10;
      animation: flowStream 14s linear infinite;
    }
    @keyframes flowStream {
      from { stroke-dashoffset: 200; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes flowStreamRev {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: 200; }
    }
    .pulsing-node {
      animation: pulseGlow 3s ease-in-out infinite alternate;
    }
    .pulsing-node-delay {
      animation: pulseGlow 3.5s ease-in-out infinite alternate 1.5s;
    }
    @keyframes pulseGlow {
      0% { r: 6px; opacity: 0.5; }
      100% { r: 10px; opacity: 1; }
    }
    .data-packet {
      fill: #38bdf8;
      filter: url(#glow);
      animation: packetMove1 6s linear infinite;
    }
    .data-packet-2 {
      fill: #c084fc;
      filter: url(#glow);
      animation: packetMove2 8s linear infinite;
    }
    @keyframes packetMove1 {
      0% { transform: translate(120px, 90px); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translate(500px, 90px); opacity: 0; }
    }
    @keyframes packetMove2 {
      0% { transform: translate(700px, 330px); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translate(1080px, 330px); opacity: 0; }
    }
    .badge-card {
      fill: rgba(30, 41, 59, 0.7);
      stroke: rgba(148, 163, 184, 0.2);
      stroke-width: 1;
      rx: 8;
    }
    .banner-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 52px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .banner-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 19px;
      font-weight: 400;
      fill: #94a3b8;
    }
    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #cbd5e1;
    }
  </style>

  <!-- Deep Background Layer -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Ambient Background Blur Spheres -->
  <circle cx="200" cy="100" r="140" fill="#0284c7" opacity="0.12" filter="url(#subtleGlow)" />
  <circle cx="1000" cy="320" r="160" fill="#7c3aed" opacity="0.12" filter="url(#subtleGlow)" />
  <circle cx="600" cy="210" r="180" fill="#0d9488" opacity="0.08" filter="url(#subtleGlow)" />

  <!-- Tech Geometric Grid -->
  <g class="bg-grid">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Dynamic Orchestration Network Pathways (Background / Midground) -->
  <g>
    <!-- Top Circuit Path -->
    <path class="flow-line" d="M 80,90 L 320,90 Q 370,90 370,140 L 370,210 Q 370,260 420,260 L 580,260" fill="none" />
    <path class="flow-line-alt" d="M 1120,330 L 880,330 Q 830,330 830,280 L 830,210 Q 830,160 780,160 L 620,160" fill="none" />
    <path class="flow-line-emerald" d="M 120,330 L 280,330 Q 330,330 330,280 L 330,210 Q 330,160 380,160 L 520,160" fill="none" />
    <path class="flow-line" d="M 1080,90 L 920,90 Q 870,90 870,140 L 870,210 Q 870,260 820,260 L 680,260" fill="none" />

    <!-- Animated Data Packets -->
    <circle class="data-packet" r="4" />
    <circle class="data-packet-2" r="4" />

    <!-- Microservice Nodes -->
    <!-- Node 1: Top Left -->
    <circle cx="80" cy="90" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <circle class="pulsing-node" cx="80" cy="90" r="7" fill="#38bdf8" />

    <!-- Node 2: Top Right -->
    <circle cx="1080" cy="90" r="14" fill="#0f172a" stroke="#818cf8" stroke-width="2" />
    <circle class="pulsing-node-delay" cx="1080" cy="90" r="7" fill="#818cf8" />

    <!-- Node 3: Bottom Left -->
    <circle cx="120" cy="330" r="14" fill="#0f172a" stroke="#10b981" stroke-width="2" />
    <circle class="pulsing-node-delay" cx="120" cy="330" r="7" fill="#10b981" />

    <!-- Node 4: Bottom Right -->
    <circle cx="1120" cy="330" r="14" fill="#0f172a" stroke="#c084fc" stroke-width="2" />
    <circle class="pulsing-node" cx="1120" cy="330" r="7" fill="#c084fc" />
  </g>

  <!-- Foreground Content Container (Ensures Text and Badges are 100% Unobstructed) -->
  <g transform="translate(0, 0)">
    <!-- Top Category Pills -->
    <g transform="translate(600, 75)" text-anchor="middle">
      <!-- Pill 1: Durable Execution -->
      <g transform="translate(-290, 0)">
        <rect class="badge-card" x="-85" y="-14" width="170" height="28" />
        <circle cx="-65" cy="0" r="4" fill="#38bdf8" />
        <text class="tag-text" x="5" y="4" text-anchor="middle">⚡ Durable Execution</text>
      </g>
      <!-- Pill 2: Deterministic Replay -->
      <g transform="translate(-95, 0)">
        <rect class="badge-card" x="-90" y="-14" width="180" height="28" />
        <circle cx="-70" cy="0" r="4" fill="#818cf8" />
        <text class="tag-text" x="5" y="4" text-anchor="middle">🔄 Deterministic Replay</text>
      </g>
      <!-- Pill 3: Saga Pattern -->
      <g transform="translate(100, 0)">
        <rect class="badge-card" x="-80" y="-14" width="160" height="28" />
        <circle cx="-60" cy="0" r="4" fill="#10b981" />
        <text class="tag-text" x="6" y="4" text-anchor="middle">🛡️ Saga Pattern</text>
      </g>
      <!-- Pill 4: Polyglot Workers -->
      <g transform="translate(290, 0)">
        <rect class="badge-card" x="-85" y="-14" width="170" height="28" />
        <circle cx="-65" cy="0" r="4" fill="#c084fc" />
        <text class="tag-text" x="5" y="4" text-anchor="middle">🌐 Polyglot Workers</text>
      </g>
    </g>

    <!-- Main Title with Glowing Gradient in Foreground -->
    <text class="banner-title" x="600" y="195" text-anchor="middle" fill="url(#titleGrad)" filter="url(#glow)">Awesome Microservice Orchestration</text>
    <text class="banner-title" x="600" y="195" text-anchor="middle" fill="url(#titleGrad)">Awesome Microservice Orchestration</text>

    <!-- Subtitle in Foreground -->
    <text class="banner-subtitle" x="600" y="240" text-anchor="middle">
      Curated Directory of Distributed Workflow Engines, Durable Execution &amp; Resilient State Machines
    </text>

    <!-- Sub-text Specs / Highlights -->
    <g transform="translate(600, 310)" text-anchor="middle">
      <rect x="-380" y="-22" width="760" height="44" rx="22" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.2" />
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="500" fill="#e2e8f0" x="0" y="5">
        🚀 Temporal • Netflix Conductor • Camunda Zeebe • Apache Airflow • AWS Step Functions • Dapr
      </text>
    </g>

    <!-- Bottom subtle indicator line -->
    <line x1="450" y1="365" x2="750" y2="365" stroke="url(#titleGrad)" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  </g>
</svg>
